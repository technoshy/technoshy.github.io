<html>
    <head>
        <title>technoshy the programming fox</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 0;
                background-color: #f4f4f4;
            }
            header {
                background-color: #333;
                color: #fff;
                padding: 10px 0;
            }
            nav ul {
                list-style-type: none;
                margin: 0;
                padding: 0;
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
            }
            nav ul li {
                margin: 5px 15px;
            }
            nav ul li a {
                color: #fff;
                text-decoration: none;
            }
            h1, h2 {
                text-align: center;
            }
            .intro, .contact {
                max-width: 600px;
                margin: 20px auto;
                padding: 20px;
                background-color: #fff;
                border-radius: 5px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            }
            footer {
                text-align: center;
                padding: 10px 0;
                background-color: #333;
                color: #fff;            
            }
            .journal {
                max-width: 600px;
                margin: 20px auto;
                padding: 20px;
                background-color: #fff;
                border-radius: 5px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
                box-sizing: border-box;
            }
            textarea {
                width: 100%;
                height: 150px;
                padding: 10px;
                border: 1px solid #ccc;
                box-sizing: border-box;
            }
            p {
                text-align: center;
            }
            @media (max-width: 600px) {
                .intro, .contact, .journal {
                    max-width: 100%;
                    margin: 10px;
                    padding: 15px;
                }
                nav ul {
                    flex-direction: column;
                    align-items: center;
                }
                nav ul li {
                    margin: 5px 0;
                }
            }
            button {
                display: block;
                margin: 10px auto;
                padding: 10px 20px;
                background-color: #333;
                color: #fff;
                border: none;
                border-radius: 5px;
                cursor: pointer;
            }
            button:hover {
                background-color: #555;
            }

</style>
<script>
    // Function to handle the "Back" button click
    function goBack() {
        window.history.back();
    }
    function goForward() {
        window.history.forward();
    }
    function addentry() {
        var entry = document.getElementById("entry").value;
        localStorage.setItem("journalEntry", entry);
        alert("Journal entry saved!");
        var savedEntry = localStorage.getItem("journalEntry");
        var entryDisplay = document.createElement("p");
        entryDisplay.textContent = savedEntry;
        var footer = document.querySelector("footer");
        footer.parentNode.insertBefore(entryDisplay, footer);
    }
    function removeEntry() {
        localStorage.removeItem("journalEntry");
        alert("Journal entry removed!");
        var entryDisplay = document.querySelector("footer").previousElementSibling;
        if (entryDisplay && entryDisplay.tagName === "P") {
            entryDisplay.remove();
        }
    }
</script>
    </head>
<body>
    <header>
        <h1>technoshy the programming fox</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="notes.html">Notes</a></li>
                <li><a href="journey.html">Journey</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <div class="journal">
        <h1>Journal</h1>
        <textarea id="entry" placeholder="Write your journal entry here..."></textarea>
        <button onclick="addentry()">Add Entry</button>
        <button onclick="removeEntry()">Remove Entry</button>
    </div>
    <footer>
        <p>&copy; 2026 technoshy the programming fox</p>
    </footer>
</body>

</html>
