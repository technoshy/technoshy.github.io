<html>
    <head>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 0;
                background-color: #f4f4f4;
            }
            header {
                background-color: #333;
                color: #fff;
                padding: 10px 0;
            }
            nav ul {
                list-style-type: none;
                margin: 0;
                padding: 0;
                display: flex;
                justify-content: center;
            }
            nav ul li {
                margin: 0 15px;
            }
            nav ul li a {
                color: #fff;
                text-decoration: none;
            }
            h1, h2 {
                text-align: center;
            }
            .content {
                max-width: 600px;
                margin: 20px auto;
                padding: 20px;
                background-color: #fff;
                border-radius: 5px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            }
            footer {
                text-align: center;
                padding: 10px 0;
                background-color: #333;
                color: #fff;
            }
            button {
                display: block;
                margin: 20px auto;
                padding: 10px 20px;
                background-color: #333;
                color: #fff;
                border: none;
                border-radius: 5px;
                cursor: pointer;
            }
            button:hover {
                background-color: #555;
            }
        </style>
        <script>
           var entries = localStorage.getItem("journalEntries") ? JSON.parse(localStorage.getItem("journalEntries")) : [];  
              var currentIndex = 0;
            function showEntry(index) {
                document.getElementById("entry").innerText = entries.length > 0 ? entries[index] : "No journal entries yet.";
            }
            window.onload = function() {
                showEntry(currentIndex);
            };
        </script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <header>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="aiclub.html">AI Club</a></li>
                    <li><a href="programmersclub.html">Programmers Club</a></li>
                    <li><a href="todo.html">To-Do List</a></li>
                    <li><a href="journal.html">Journal</a></li>
                    <li><a href="calculator.html">Calculator</a></li>
                </ul>
            </nav>
        </header>
        <div class="content">
            <h1>Journal</h1>
            <p>Welcome to my journal. Here I share my thoughts and experiences.</p>
            <div id="entry"></div>
            <button onclick="currentIndex = (currentIndex + 1) % entries.length; showEntry(currentIndex);">Next Entry</button> 
            <form onsubmit="event.preventDefault(); var newEntry = document.getElementById('newEntry').value; entries.push(newEntry); localStorage.setItem('journalEntries', JSON.stringify(entries)); document.getElementById('newEntry').value = ''; showEntry(currentIndex);">
                <textarea id="newEntry" placeholder="Write your journal entry here..." required></textarea>
                <button type="submit">Add Entry</button> 
        </div>
        <footer>
            <p>&copy; 2026 technoshy. All rights reserved.</p>
        </footer>
    </body>
</html>
