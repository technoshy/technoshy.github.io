<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body {
        background: linear-gradient(180deg, #f5f7f3 0%, #edf3ef 100%);
      }
      .journal-card {
        max-width: 760px;
        margin: 4rem auto;
        border-radius: 1rem;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.08);
      }
      .entry-card {
        border-radius: 0.75rem;
      }
      .entry-date {
        font-size: 0.8rem;
        color: #6c757d;
      }
      .entry-text {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card journal-card p-4 p-md-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <p class="text-success fw-bold text-uppercase small mb-1">Reflections</p>
            <h1 class="h2 mb-0">My Journal</h1>
          </div>
          <a href="index.html" class="btn btn-outline-dark btn-sm">Back</a>
        </div>

        <div class="mb-4">
          <input id="entry-title" type="text" class="form-control mb-2" placeholder="Title">
          <textarea id="entry-text" class="form-control mb-2" rows="4" placeholder="Write what's on your mind..."></textarea>
          <button class="btn btn-primary" type="button" onclick="addEntry()">Save entry</button>
        </div>

        <div id="entry-list" class="d-flex flex-column gap-3"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      function getEntries() {
        return JSON.parse(localStorage.getItem('journalEntries') || '[]');
      }

      function saveEntries(entries) {
        localStorage.setItem('journalEntries', JSON.stringify(entries));
      }

      function renderEntries() {
        const entryList = document.getElementById('entry-list');
        const entries = getEntries();
        entryList.innerHTML = '';

        if (!entries.length) {
          entryList.innerHTML = '<p class="text-secondary mb-0">No entries yet. Write your first one above.</p>';
          return;
        }

        entries.forEach((entry, index) => {
          const card = document.createElement('div');
          card.className = 'card entry-card p-3';

          const header = document.createElement('div');
          header.className = 'd-flex justify-content-between align-items-start gap-2';

          const titleWrap = document.createElement('div');
          const title = document.createElement('h2');
          title.className = 'h5 mb-1';
          title.textContent = entry.title || 'Untitled';
          const date = document.createElement('p');
          date.className = 'entry-date mb-2';
          date.textContent = entry.date;
          titleWrap.appendChild(title);
          titleWrap.appendChild(date);

          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'btn btn-outline-danger btn-sm';
          deleteBtn.textContent = 'Remove';
          deleteBtn.addEventListener('click', () => removeEntry(index));

          header.appendChild(titleWrap);
          header.appendChild(deleteBtn);

          const text = document.createElement('p');
          text.className = 'entry-text mb-0';
          text.textContent = entry.text;

          card.appendChild(header);
          card.appendChild(text);
          entryList.appendChild(card);
        });
      }

      function addEntry() {
        const titleInput = document.getElementById('entry-title');
        const textInput = document.getElementById('entry-text');
        const title = titleInput.value.trim();
        const text = textInput.value.trim();

        if (!text) return;

        const entries = getEntries();
        entries.unshift({ title, text, date: new Date().toLocaleString() });
        saveEntries(entries);
        renderEntries();
        titleInput.value = '';
        textInput.value = '';
        titleInput.focus();
      }

      function removeEntry(index) {
        const entries = getEntries();
        entries.splice(index, 1);
        saveEntries(entries);
        renderEntries();
      }

      renderEntries();
    </script>
  </body>
</html>
