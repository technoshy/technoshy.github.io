<html>
    <head>
        <title>Tic Tac Toe</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                margin: 0;
                padding: 0;
                background-color: #f4f4f4;
            }
            header {
                width: 100%;
                background-color: #333;
                color: #fff;
                padding: 10px 0;
            }
            nav ul {
                list-style-type: none;
                margin: 0;
                padding: 0;
                display: flex;
                justify-content: center;
            }
            nav ul li {
                margin: 0 15px;
            }
            nav ul li a {
                color: #fff;
                text-decoration: none;
            }
            h1, h2 {
                text-align: center;
            }
            #game {
                display: grid;
                grid-template-columns: repeat(3, 100px);
                grid-template-rows: repeat(3, 100px);
                gap: 5px;
            }
            .cell {
                width: 100px;
                height: 100px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 2em;
                background-color: #fff;
                border: 1px solid #000;
                cursor: pointer;
            }
            button {
                margin-top: 20px;
                margin-bottom: 20px;
                padding: 10px 20px;
                font-size: 1em;
            }
            footer {
                width: 100%;
                text-align: center;
                padding: 10px 0;
                background-color: #333;
                color: #fff;
                margin-top: auto;
            }

            @media (max-width: 600px) {
                nav ul {
                    flex-direction: column;
                    align-items: center;
                }
                nav ul li {
                    margin: 8px 0;
                }
                h1, h2 {
                    font-size: 1.4em;
                    padding: 0 10px;
                }
                #game {
                    grid-template-columns: repeat(3, 80px);
                    grid-template-rows: repeat(3, 80px);
                }
                .cell {
                    width: 80px;
                    height: 80px;
                    font-size: 1.6em;
                }
            }
        </style>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <header>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="aiclub.html">AI Club</a></li>
                    <li><a href="programmersclub.html">Programmers Club</a></li>
                    <li><a href="todo.html">To-Do List</a></li>
                    <li><a href="journal.html">Journal</a></li>
                    <li><a href="calculator.html">Calculator</a></li>
                    <li><a href="tictactoe.html">Tic Tac Toe</a></li>
                </ul>
            </nav>
        </header>
        <h1>Tic Tac Toe</h1>
        <h2 id="status">
            Player X's turn
        </h2>
        <div id="game">
            <div class="row">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
            </div>
            <div class="row">
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
            </div>
            <div class="row">
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>
        </div>
        <button id="reset">Reset Game</button>
        <script>
            const cells = document.querySelectorAll('.cell');
            let currentPlayer = 'X';
            const winningCombinations = [
                [0, 1, 2],
                [3, 4, 5],
                [6, 7, 8],
                [0, 3, 6],
                [1, 4, 7],
                [2, 5, 8],
                [0, 4, 8],  
                [2, 4, 6]
            ];      
            </script>
        <script>
            function checkWinner() {
                for (const combination of winningCombinations) {
                    const [a, b, c] = combination;
                    if (cells[a].textContent && cells[a].textContent === cells[b].textContent && cells[a].textContent === cells[c].textContent) {
                        alert(`Player ${                
cells[a].textContent} wins!`);
                        return true;
                    }
                }
                return false;
            }
            cells.forEach(cell => {
                cell.addEventListener('click', () => {              
                    if (!cell.textContent) {
                        cell.textContent = currentPlayer;
                        if (checkWinner()) {
                            cells.forEach(c => c.removeEventListener('click', arguments.callee));
                        } else {
                            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                        }
                    }
                    document.getElementById('status').textContent = `Player ${currentPlayer}'s turn`;   
                });
            });
            document.getElementById('reset').addEventListener('click', () => {
                cells.forEach(cell => cell.textContent = '');
                currentPlayer = 'X';
                document.getElementById('status').textContent = `Player ${currentPlayer}'s turn`;
            });

        </script>
        <footer>
            <p>&copy; 2026 technoshy. All rights reserved.</p>
        </footer>
    </body>
</html>
