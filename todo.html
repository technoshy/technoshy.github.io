<html>
    <head>
        <title>To-Do List</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 0;
                background-color: #f4f4f4;
            }
            header {
                background-color: #333;
                color: #fff;
                padding: 10px 0;
            }
            nav ul {
                list-style-type: none;
                margin: 0;
                padding: 0;
                display: flex;
                justify-content: center;
            }
            nav ul li {
                margin: 0 15px;
            }
            nav ul li a {
                color: #fff;
                text-decoration: none;
            }
            h1, h2 {
                text-align: center;
            }
            .content {
                max-width: 600px;
                margin: 20px auto;
                padding: 20px;
                background-color: #fff;
                border-radius: 5px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            }
            footer {
                text-align: center;
                padding: 10px 0;
                background-color: #333;
                color: #fff;
            }
            #taskList {
                list-style-type: none;
                padding: 0;
            }
        </style>
        <script>
            // JavaScript code for To-Do List functionality can be added here
            var tasks = localStorage.getItem('tasks') ? JSON.parse(localStorage.getItem('tasks')) : [];

        </script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <header>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="aiclub.html">AI Club</a></li>
                    <li><a href="programmersclub.html">Programmers Club</a></li>
                    <li><a href="todo.html">To-Do List</a></li>
                    <li><a href="journal.html">Journal</a></li>
                </ul>
            </nav>
        </header>
        <div class="content">
            <h1>To-Do List</h1>
            <p>Manage your tasks efficiently.</p>
            <ul id="taskList"></ul>
            <form onsubmit="event.preventDefault(); var newTask = document.getElementById('newTask').value; tasks.push(newTask); localStorage.setItem('tasks', JSON.stringify(tasks)); document.getElementById('newTask').value = ''; renderTasks();">
                <input type="text" id="newTask" placeholder="Add a new task" required>
                <button type="submit">Add Task</button>
            </form>
            <script>
                function renderTasks() {
                    var taskList = document.getElementById('taskList');
                    taskList.innerHTML = '';
                    for (var i = 0; i < tasks.length; i++) {
                        var li = document.createElement('li');
                        li.innerText = tasks[i];
                        taskList.appendChild(li);
                    }
                }
                window.onload = function() {
                    renderTasks();
                };
            </script>
        </div>
        <footer>
            <p>&copy; 2026 technoshy. All rights reserved.</p>
        </footer>
    </body>
</html>
