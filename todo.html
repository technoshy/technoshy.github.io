<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List — technoshy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #f2f4ee;
        --surface: #fbfcf8;
        --ink: #18221d;
        --muted: #5d6961;
        --line: #cbd3cb;
        --green: #245d3f;
        --mint: #b9f0c2;
        --acid: #e0fb6a;
        --coral: #ff9275;
        --shadow: rgba(24, 34, 29, 0.12);
      }

      body.dark {
        --bg: #0f1117;
        --surface: #161b22;
        --ink: #e6edf3;
        --muted: #8b949e;
        --line: #30363d;
        --shadow: rgba(0, 0, 0, 0.4);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-width: 320px;
        background: var(--bg);
        color: var(--ink);
        font-family: "Space Grotesk", sans-serif;
        transition: background-color 0.3s, color 0.3s;
      }

      a { color: inherit; text-decoration: none; transition: opacity 0.2s; }
      a:hover { opacity: 0.7; }

      .site-shell { display: flex; flex-direction: column; min-height: 100vh; }
      main { flex: 1; }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 100;
        height: 82px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 0 40px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
      }

      .wordmark { font-weight: 600; font-size: 16px; display: flex; align-items: center; gap: 8px; }
      .wordmark .fox { font-size: 20px; }
      .wordmark .cursor { display: inline-block; animation: blink 1s infinite; }
      @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

      nav { display: flex; align-items: center; gap: 32px; font-size: 14px; font-weight: 500; }
      nav a { position: relative; }
      nav a::after { content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 2px; background: var(--green); transition: width 0.3s; }
      nav a:hover::after { width: 100%; }
      .nav-contact { padding: 8px 16px; border: 1px solid var(--line); border-radius: 4px; background: var(--green); color: white; }
      .nav-contact::after { display: none; }

      .theme-toggle { background: none; border: none; font-size: 18px; cursor: pointer; padding: 8px; display: flex; align-items: center; justify-content: center; transition: opacity 0.2s; }
      .theme-toggle:hover { opacity: 0.6; }

      .todo-section { padding: 64px 40px; max-width: 700px; margin: 0 auto; }
      .eyebrow { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 0; }
      .todo-section h1 { font-size: 40px; font-weight: 700; margin: 16px 0 40px; }
      .todo-section h1 em { font-style: italic; color: var(--green); }

      .composer { display: flex; gap: 12px; margin-bottom: 32px; }
      .composer input {
        flex: 1;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--surface);
        color: var(--ink);
        font-family: inherit;
        font-size: 14px;
      }
      .composer input:focus { outline: none; border-color: var(--green); }

      .button { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border: 1px solid var(--line); border-radius: 4px; font-weight: 600; font-size: 14px; transition: all 0.3s; cursor: pointer; }
      .button-primary { background: var(--green); color: white; border-color: var(--green); }
      .button-primary:hover { background: #1d4a32; opacity: 1; }

      #todo-list { display: flex; flex-direction: column; gap: 12px; list-style: none; margin: 0; padding: 0; }
      .todo-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 20px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        transition: all 0.3s;
      }
      .todo-item:hover { border-color: var(--green); box-shadow: 0 8px 32px var(--shadow); }
      .todo-item.completed .todo-text { text-decoration: line-through; color: var(--muted); }
      .todo-left { display: flex; align-items: center; gap: 14px; }
      .todo-left input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--green); cursor: pointer; }
      .todo-text { font-size: 14px; }
      .todo-remove {
        background: none;
        border: 1px solid var(--line);
        border-radius: 4px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
        padding: 6px 10px;
        cursor: pointer;
        flex-shrink: 0;
      }
      .todo-remove:hover { border-color: var(--coral); color: var(--coral); opacity: 1; }
      .empty-state { color: var(--muted); font-size: 14px; }

      .footer { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 18px 40px; border-top: 1px solid var(--line); background: var(--surface); font-size: 12px; color: var(--muted); }

      @media (max-width: 768px) {
        .topbar { padding: 0 24px; height: 64px; }
        nav { gap: 16px; font-size: 12px; }
        .todo-section { padding: 40px 24px; }
        .todo-section h1 { font-size: 28px; }
      }
    </style>
  </head>
  <body>
    <div class="site-shell">
      <header class="topbar">
        <a class="wordmark" href="index.html" aria-label="Technoshy home">technoshy<span class="fox">🦊</span><span class="cursor">_</span></a>
        <nav aria-label="Main navigation">
          <a href="index.html#work">Work</a>
          <a href="index.html#skills">Skills</a>
          <a href="index.html#approach">About</a>
          <a href="todo.html">Todo</a>
          <a href="journal.html">Journal</a>
          <a href="index.html#contact" class="nav-contact">Say hello <span aria-hidden="true">↗</span></a>
          <button class="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch theme">
            <span class="theme-icon" aria-hidden="true">☼</span>
          </button>
        </nav>
      </header>

      <main>
        <section class="todo-section" aria-labelledby="todo-title">
          <p class="eyebrow">Planning</p>
          <h1 id="todo-title">Todo <em>list.</em></h1>

          <div class="composer">
            <input id="new-todo" type="text" placeholder="Add a new task" aria-label="Add a new task">
            <button class="button button-primary" type="button" onclick="addTodo()">Add</button>
          </div>

          <ul id="todo-list"></ul>
        </section>
      </main>

      <footer class="footer"><span>© nt</span><span>Made with intention in the internet</span><a href="index.html#hero-title">Back to top ↑</a></footer>
    </div>

    <script>
      const themeToggle = document.querySelector('.theme-toggle');
      const themeIcon = document.querySelector('.theme-icon');
      function setTheme(theme) {
        const isDark = theme === 'dark';
        document.body.classList.toggle('dark', isDark);
        themeIcon.textContent = isDark ? '☾' : '☼';
        themeToggle.setAttribute('aria-label', isDark ? 'Switch to light theme' : 'Switch to dark theme');
        localStorage.setItem('technoshy-theme', theme);
      }
      const savedTheme = localStorage.getItem('technoshy-theme');
      if (savedTheme === 'dark' || savedTheme === 'light') setTheme(savedTheme);
      themeToggle.addEventListener('click', () => setTheme(document.body.classList.contains('dark') ? 'light' : 'dark'));

      function getTodos() {
        return JSON.parse(localStorage.getItem('todos') || '[]');
      }

      function saveTodos(todos) {
        localStorage.setItem('todos', JSON.stringify(todos));
      }

      function renderTodos() {
        const todoList = document.getElementById('todo-list');
        const todos = getTodos();
        todoList.innerHTML = '';

        if (!todos.length) {
          todoList.innerHTML = '<li class="empty-state">No tasks yet. Add one above.</li>';
          return;
        }

        todos.forEach((todo, index) => {
          const li = document.createElement('li');
          li.className = `todo-item ${todo.done ? 'completed' : ''}`;

          const left = document.createElement('div');
          left.className = 'todo-left';

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = todo.done;
          checkbox.setAttribute('aria-label', `Mark ${todo.text} as done`);
          checkbox.addEventListener('change', () => toggleTodo(index));

          const text = document.createElement('span');
          text.className = 'todo-text';
          text.textContent = todo.text;

          left.appendChild(checkbox);
          left.appendChild(text);

          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'todo-remove';
          deleteBtn.textContent = 'Remove';
          deleteBtn.addEventListener('click', () => removeTodo(index));

          li.appendChild(left);
          li.appendChild(deleteBtn);
          todoList.appendChild(li);
        });
      }

      function addTodo() {
        const input = document.getElementById('new-todo');
        const text = input.value.trim();

        if (!text) return;

        const todos = getTodos();
        todos.push({ text, done: false });
        saveTodos(todos);
        renderTodos();
        input.value = '';
        input.focus();
      }

      function toggleTodo(index) {
        const todos = getTodos();
        todos[index].done = !todos[index].done;
        saveTodos(todos);
        renderTodos();
      }

      function removeTodo(index) {
        const todos = getTodos();
        todos.splice(index, 1);
        saveTodos(todos);
        renderTodos();
      }

      document.getElementById('new-todo').addEventListener('keydown', function (event) {
        if (event.key === 'Enter') {
          addTodo();
        }
      });

      renderTodos();
    </script>
  </body>
</html>
