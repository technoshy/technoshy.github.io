        <script>
              // Add event listeners to number buttons
            const buttons = document.querySelectorAll('button');
            buttons.forEach(button => {
                button.addEventListener('click', () => {
                    if (button.id === 'calculate' || button.id === 'backButton' || button.id === 'clearButton') {
                        return; // Skip the calculate, back, and clear buttons
                    }   
                    const expressionInput = document.getElementById('expression');
                    expressionInput.value += button.textContent;
                });
            });
            $('#calculate').click(function() {
                const expression = $('#expression').val();
                try {
                    const result = math.evaluate(expression);
                    $('#result').text(result);
                } catch (error) {
                    $('#result').text('Error: Invalid expression');
                }
            });
        </script>
